{% extends '_auth.html' %}{% block title %}Verify · Complete Omics LabOS{% endblock %}
{% block auth_body %}
<h1>Two-factor verification</h1>
<p>Enter the 6-digit code from your authenticator app.</p>
<form method="post">
  <label for="code">Authentication code</label>
  <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required autofocus style="font-size:20px;letter-spacing:.3em;text-align:center;font-family:var(--mono)">
  <button type="submit">Verify</button>
</form>
{% endblock %}
