{% extends 'base.html' %}{% block body %}<div class="grid2"><div class="card"><h1>Batches</h1><table><tr><th>Batch</th><th>Name</th><th>Method</th><th>Instrument</th><th>Status</th><th>Action</th></tr>{% for b in batches %}<tr><td><a href="{{url_for('batch_detail',batch_id=b.id)}}">{{b.batch_no}}</a></td><td>{{b.name}}</td><td>{{b.method or ''}}</td><td>{{b.instrument or ''}}</td><td>{{b.status}}</td><td>{% if b.status=='Open' %}<a class="button danger-button small-action" href="{{url_for('batch_detail',batch_id=b.id)}}">Review / Delete</a>{% else %}<span class="muted">Locked</span>{% endif %}</td></tr>{% endfor %}</table></div><div class="card"><h2>Create batch</h2><form method="post"><label>Name</label><input name="name" required><label>Method</label><input name="method" placeholder="Luminex / LC-MS/MS / Chemistry"><label>Instrument</label><input name="instrument"><label>Notes</label><textarea name="notes"></textarea><button>Create Batch</button></form></div></div>{% endblock %}
