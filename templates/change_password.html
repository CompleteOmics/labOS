{% extends 'base.html' %}{% block body %}<div class="login card"><h1>Change Password</h1>{% if u.must_change_password %}<div class="clinical-note">Your administrator issued a temporary password. Choose your own password before continuing.</div>{% endif %}<form method="post"><label>Current password</label><input type="password" name="current_password" required autocomplete="current-password"><label>New password</label><input type="password" name="new_password" required autocomplete="new-password"><label>Confirm new password</label><input type="password" name="confirm_password" required autocomplete="new-password"><small>Minimum 10 characters with letters and numbers. A longer passphrase is recommended.</small><button>Save new password</button></form></div>{% endblock %}
