{% extends '_auth.html' %}{% block title %}First-time setup · Complete Omics LabOS{% endblock %}
{% block auth_body %}
<h1>First-time setup</h1>
<p>Create the master administrator for this LabOS installation. No demo accounts are included.</p>
<form method="post">
  <label for="name">Full name</label><input id="name" name="name" autocomplete="name" required>
  <label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
  <label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" required>
  <label for="password">Password</label><input id="password" type="password" name="password" minlength="12" autocomplete="new-password" required>
  <label for="confirm_password">Confirm password</label><input id="confirm_password" type="password" name="confirm_password" minlength="12" autocomplete="new-password" required>
  <small>At least 12 characters, with letters and numbers.</small>
  <button type="submit" style="margin-top:16px">Create master administrator</button>
</form>
{% endblock %}
