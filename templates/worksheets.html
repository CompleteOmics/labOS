{% extends 'base.html' %}{% block body %}<div class="grid2"><div class="card"><h1>Worksheets</h1><table><tr><th>Title</th><th>Batch ID</th><th>Status</th><th>Created</th><th>Action</th></tr>{% for w in worksheets %}<tr><td><a href="{{url_for('worksheet_detail',worksheet_id=w.id)}}">{{w.title}}</a></td><td>{{w.batch_id or ''}}</td><td>{{w.status}}</td><td>{{fmt_dt(w.created_at)}}</td><td>{% if w.status=='Draft' %}<form method="post" action="{{url_for('worksheet_detail',worksheet_id=w.id)}}" onsubmit="return confirm('Delete this draft worksheet now? This is intended for worksheets created by mistake.');"><input type="hidden" name="action" value="delete_worksheet"><button class="danger-button small-action">Delete</button></form>{% else %}<span class="muted">Locked</span>{% endif %}</td></tr>{% endfor %}</table></div><div class="card"><h2>New worksheet</h2><form method="post"><input name="title" required placeholder="e.g. HART Luminex Run Worksheet"><select name="batch_id"><option value="">No batch</option>{% for b in batches %}<option value="{{b.id}}">{{b.batch_no}} — {{b.name}}</option>{% endfor %}</select><textarea name="notes" placeholder="Instructions / run notes"></textarea><button>Create</button></form></div></div>{% endblock %}
