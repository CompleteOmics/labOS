{% extends 'base.html' %}{% block body %}<div class="grid2"><div class="card"><h1>96-Well Plate Maps</h1><table><tr><th>Name</th><th>Batch</th><th>Format</th><th>Created</th></tr>{% for p in plates %}<tr><td><a href="{{url_for('plate_detail',plate_id=p.id)}}">{{p.name}}</a></td><td>{{p.batch_id or ''}}</td><td>{{p.plate_format}}</td><td>{{fmt_dt(p.created_at)}}</td></tr>{% endfor %}</table></div><div class="card"><h2>Create plate</h2><form method="post"><input name="name" required placeholder="Plate name"><select name="batch_id"><option value="">No batch</option>{% for b in batches %}<option value="{{b.id}}">{{b.batch_no}} · {{b.name}}</option>{% endfor %}</select><button>Create 96-Well Plate</button></form></div></div>{% endblock %}
